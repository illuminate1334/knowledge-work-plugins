# CI for Solar ROI Analyzer only.
# Intentionally no deploy, secrets, or Anthropic/NREL API keys.
name: Solar ROI Analyzer

on:
  push:
    paths:
      - "solar-roi-v2/**"
      - ".github/workflows/solar-roi-v2.yml"
  pull_request:
    paths:
      - "solar-roi-v2/**"
      - ".github/workflows/solar-roi-v2.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar-roi-v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solar-roi-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
